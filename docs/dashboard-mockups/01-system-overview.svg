<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #d7dce3; stroke-width: 1; }
      .header { fill: #20242a; }
      .text { font-family: Inter, Arial, sans-serif; fill: #20242a; }
      .muted { fill: #68707d; }
      .small { font-size: 18px; }
      .body { font-size: 22px; }
      .title { font-size: 34px; font-weight: 700; }
      .h2 { font-size: 26px; font-weight: 700; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 18px; }
      .ok { fill: #178a55; }
      .warn { fill: #b36b00; }
      .danger { fill: #b42318; }
      .blue { fill: #2463eb; }
      .line { stroke: #67758a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .chip { fill: #edf2ff; stroke: #bfd0ff; }
      .chip2 { fill: #ecfdf3; stroke: #b7e5c8; }
      .chip3 { fill: #fff7ed; stroke: #ffd6a8; }
      .node { fill: #ffffff; stroke: #aab4c3; stroke-width: 2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67758a"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="900"/>
