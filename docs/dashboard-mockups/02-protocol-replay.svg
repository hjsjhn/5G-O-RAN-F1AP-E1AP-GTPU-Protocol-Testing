<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
      .bg { fill: #f6f7f9; }
      .panel { fill: #ffffff; stroke: #d7dce3; stroke-width: 1; }
      .dark { fill: #20242a; }
      .text { font-family: Inter, Arial, sans-serif; fill: #20242a; }
      .title { font-size: 34px; font-weight: 700; }
      .h2 { font-size: 26px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 18px; }
      .muted { fill: #68707d; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 17px; }
      .ok { fill: #178a55; }
      .blue { fill: #2463eb; }
      .line { stroke: #6b7280; stroke-width: 3; marker-end: url(#arrow); }
      .chip { fill: #edf2ff; stroke: #bfd0ff; }
      .chip2 { fill: #ecfdf3; stroke: #b7e5c8; }
      .code { fill: #111827; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="900"/>
  <rect class="dark" width="1440" height="76"/>
  <text class="text title" x="34" y="50" fill="#fff">Protocol Parsing & Replay</text>
  <text class="text small" x="1090" y="48" fill="#d8dee9">JSON · APER · pcap · live peer</text>

  <rect class="panel" x="26" y="104" width="344" height="760" rx="8"/>
  <text class="text h2" x="52" y="146">协议与消息</text>
  <rect class="chip" x="52" y="176" width="284" height="44" rx="7"/>
  <text class="text body blue" x="72" y="205">F1AP UEContextSetup</text>
  <text class="text body" x="72" y="260">E1AP BearerContext</text>
  <text class="text body" x="72" y="315">NGAP InitialUEMessage</text>
  <text class="text body" x="72" y="370">GTP-U T-PDU</text>
  <text class="text body" x="72" y="425">XnAP Handover 离线</text>
  <line x1="52" y1="464" x2="336" y2="464" stroke="#d7dce3"/>
  <text class="text small muted" x="52" y="506">筛选条件</text>
  <text class="text small" x="52" y="542">消息类型 · 关键 IE · TEID</text>
  <text class="text small" x="52" y="578">真实 capture · 生成 testcase</text>

  <rect class="panel" x="396" y="104" width="652" height="360" rx="8"/>
  <text class="text h2" x="424" y="146">结构化解析结果</text>
  <rect class="code" x="424" y="174" width="596" height="260" rx="7"/>
  <text class="text mono" x="448" y="210" fill="#e5e7eb">{</text>
  <text class="text mono" x="474" y="242" fill="#93c5fd">"protocol"</text>
  <text class="text mono" x="604" y="242" fill="#e5e7eb">: "F1AP",</text>
  <text class="text mono" x="474" y="274" fill="#93c5fd">"message"</text>
  <text class="text mono" x="604" y="274" fill="#e5e7eb">: "UEContextSetupRequest",</text>
  <text class="text mono" x="474" y="306" fill="#93c5fd">"ies"</text>
  <text class="text mono" x="604" y="306" fill="#e5e7eb">: ["gNB-DU-UE-F1AP-ID", "SRBs-ToBeSetup"],</text>
  <text class="text mono" x="474" y="338" fill="#93c5fd">"roundTrip"</text>
  <text class="text mono" x="604" y="338" fill="#e5e7eb">: "PASS",</text>
  <text class="text mono" x="474" y="370" fill="#93c5fd">"peerValidation"</text>
  <text class="text mono" x="604" y="370" fill="#e5e7eb">: "L4 transaction matched"</text>
  <text class="text mono" x="448" y="402" fill="#e5e7eb">}</text>

  <rect class="panel" x="396" y="492" width="652" height="372" rx="8"/>
  <text class="text h2" x="424" y="534">编码回放链路</text>
  <rect class="chip2" x="430" y="590" width="130" height="54" rx="7"/>
  <text class="text body ok" x="454" y="625">JSON</text>
  <line class="line" x1="570" y1="617" x2="640" y2="617"/>
  <rect class="chip2" x="650" y="590" width="140" height="54" rx="7"/>
  <text class="text body ok" x="681" y="625">APER</text>
  <line class="line" x1="800" y1="617" x2="870" y2="617"/>
  <rect class="chip2" x="880" y="590" width="140" height="54" rx="7"/>
  <text class="text body ok" x="918" y="625">pcap</text>
  <line class="line" x1="560" y1="704" x2="650" y2="704"/>
  <rect class="chip2" x="430" y="674" width="130" height="54" rx="7"/>
  <text class="text body ok" x="454" y="709">tshark</text>
  <rect class="chip2" x="660" y="674" width="200" height="54" rx="7"/>
  <text class="text body ok" x="688" y="709">live peer</text>
  <text class="text small muted" x="424" y="790">验收点：生成 payload 与 pcap 读回 hash 一致，并能进入真实 CU-CP/CU-UP 对端。</text>

  <rect class="panel" x="1074" y="104" width="390" height="760" rx="8"/>
  <text class="text h2" x="1100" y="146">验收映射</text>
  <text class="text body" x="1100" y="208">1. 结构化 JSON</text>
  <text class="text small muted" x="1100" y="238">F1AP/E1AP/NGAP/GTP-U/XnAP</text>
  <text class="text body" x="1100" y="304">2. 至少 5 类控制消息</text>
  <text class="text small muted" x="1100" y="334">APER 重新编码 + tshark 识别</text>
  <text class="text body" x="1100" y="400">3. GTP-U packet</text>
  <text class="text small muted" x="1100" y="430">JSON/template -> pcap -> live replay</text>
  <text class="text body" x="1100" y="496">4. 对端验证</text>
  <text class="text small muted" x="1100" y="526">F1AP/E1AP 到真实组件 L3/L4</text>
  <rect class="chip2" x="1100" y="610" width="250" height="46" rx="7"/>
  <text class="text body ok" x="1122" y="640">当前页面：PASS 证据页</text>
</svg>
