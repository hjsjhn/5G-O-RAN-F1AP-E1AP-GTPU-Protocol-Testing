# DU configuration with ZMQ RF frontend (no SDR hardware required)
f1ap:
  cu_cp_addr: 10.53.1.4
  bind_addr: 10.53.1.6

f1u:
  socket:
    -
      bind_addr: 172.18.10.3

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://10.53.1.6:2000,rx_port=tcp://10.53.1.7:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 75
  rx_gain: 75
  time_alignment_calibration: 0

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pci: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 0
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/du.log
  all_level: info

pcap:
  f1ap_enable: true
  f1ap_filename: /tmp/du_f1ap.pcap
  f1u_enable: true
  f1u_filename: /tmp/du_f1u.pcap
