# 5GC (Open5GS) service
# Provides AMF, SMF, UPF for 5G SA core network
# Note: Open5GS container must be built from srsRAN source first (see docker/open5gs/)
services:
  5gc:
    container_name: open5gs_5gc
    build:
      context: ../open5gs
      dockerfile: Dockerfile
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.0"
    image: srsran/open5gs:latest
    privileged: true
    ports:
      - "9999:9999/tcp"
    env_file:
      - open5gs.env
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    networks:
      ran:
        ipv4_address: ${OPEN5GS_IP:-10.53.1.2}

networks:
  ran:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24
