# 5G SA Core Network (Open5GS) using herlesupreeth/docker_open5gs images
# All NFs on 5gc_net; AMF and UPF also on ran_net for RAN access
# Config templates are mounted from docker/open5gs-5gc/ (cloned from herlesupreeth)
services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    command: --bind_ip 0.0.0.0
    env_file:
      - .env
    volumes:
      - mongodbdata:/data/db
    networks:
      5gc:
        ipv4_address: ${MONGO_IP}

  webui:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: webui
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=webui
    volumes:
      - ../open5gs-5gc/webui:/mnt/webui
    ports:
      - "9999:9999/tcp"
    networks:
      5gc:
        ipv4_address: ${WEBUI_IP}

  nrf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: nrf
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=nrf
    volumes:
      - ../open5gs-5gc/nrf:/mnt/nrf
    networks:
      5gc:
        ipv4_address: ${NRF_IP}

  scp:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: scp
    depends_on:
      - nrf
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=scp
    volumes:
      - ../open5gs-5gc/scp:/mnt/scp
    networks:
      5gc:
        ipv4_address: ${SCP_IP}

  ausf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: ausf
    depends_on:
      - nrf
      - scp
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=ausf
    volumes:
      - ../open5gs-5gc/ausf:/mnt/ausf
    networks:
      5gc:
        ipv4_address: ${AUSF_IP}

  udr:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: udr
    depends_on:
      - nrf
      - scp
      - mongo
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=udr
    volumes:
      - ../open5gs-5gc/udr:/mnt/udr
    networks:
      5gc:
        ipv4_address: ${UDR_IP}

  udm:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: udm
    depends_on:
      - nrf
      - scp
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=udm
    volumes:
      - ../open5gs-5gc/udm:/mnt/udm
    networks:
      5gc:
        ipv4_address: ${UDM_IP}

  pcf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: pcf
    depends_on:
      - nrf
      - scp
      - mongo
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=pcf
    volumes:
      - ../open5gs-5gc/pcf:/mnt/pcf
    networks:
      5gc:
        ipv4_address: ${PCF_IP}

  bsf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: bsf
    depends_on:
      - nrf
      - scp
      - mongo
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=bsf
    volumes:
      - ../open5gs-5gc/bsf:/mnt/bsf
    networks:
      5gc:
        ipv4_address: ${BSF_IP}

  nssf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: nssf
    depends_on:
      - nrf
      - scp
      - mongo
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=nssf
    volumes:
      - ../open5gs-5gc/nssf:/mnt/nssf
    networks:
      5gc:
        ipv4_address: ${NSSF_IP}

  smf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: smf
    depends_on:
      - nrf
      - scp
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=smf
      - DEPLOY_MODE=5G
    volumes:
      - ../open5gs-5gc/smf:/mnt/smf
    networks:
      5gc:
        ipv4_address: ${SMF_IP}

  amf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: amf
    depends_on:
      - nrf
      - scp
      - ausf
      - udm
      - udr
      - pcf
      - bsf
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=amf
    volumes:
      - ../open5gs-5gc/amf:/mnt/amf
    expose:
      - "38412/sctp"
      - "7777/tcp"
    networks:
      5gc:
        ipv4_address: ${AMF_IP}
      ran:
        ipv4_address: ${AMF_RAN_IP}

  upf:
    image: ghcr.io/herlesupreeth/docker_open5gs:master
    container_name: upf
    depends_on:
      - nrf
      - scp
      - smf
    env_file:
      - .env
    environment:
      - COMPONENT_NAME=upf
    volumes:
      - ../open5gs-5gc/upf:/mnt/upf
    expose:
      - "2152/udp"
      - "8805/udp"
    cap_add:
      - NET_ADMIN
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      5gc:
        ipv4_address: ${UPF_IP}
      ran:
        ipv4_address: ${UPF_RAN_IP}

networks:
  5gc:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${5GC_NETWORK}
  ran:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24

volumes:
  mongodbdata:
