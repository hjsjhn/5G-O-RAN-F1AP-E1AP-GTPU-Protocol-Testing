# CU-DU split architecture: CU-CP, CU-UP, DU
# Uses herlesupreeth/docker_srsran pre-built image (includes srscucp, srscuup, srsdu)
# Use with: docker-compose -f docker-compose.yml -f docker-compose.split.yml up

x-srsran-common: &srsran-common
  platform: linux/amd64
  image: ghcr.io/herlesupreeth/docker_srsran:master
  env_file:
    - .env

services:
  cu-cp:
    <<: *srsran-common
    container_name: srsran_cu_cp
    networks:
      ran:
        ipv4_address: ${CU_CP_IP}
    volumes:
      - cu_cp_pcap:/tmp
    depends_on:
      amf:
        condition: service_started
    configs:
      - cu_cp_config.yml
      - cu_cp_compose_config.yml
    healthcheck:
      test: [ "CMD-SHELL", "for p in 38462 38472; do ss -l -H -A sctp \"sport = :$p\" | grep -q . || exit 1; done; exit 0" ]
      interval: 3s
      timeout: 1s
      retries: 60
    command: srscucp -c /cu_cp_config.yml -c /cu_cp_compose_config.yml

  cu-up:
    <<: *srsran-common
    container_name: srsran_cu_up
    networks:
      ran:
        ipv4_address: ${CU_UP_IP}
      f1u:
        ipv4_address: ${CU_UP_F1U_IP}
    volumes:
      - cu_up_pcap:/tmp
    depends_on:
      cu-cp:
        condition: service_healthy
    configs:
      - cu_up_config.yml
      - cu_up_compose_config.yml
    command: srscuup -c /cu_up_config.yml -c /cu_up_compose_config.yml

  du:
    <<: *srsran-common
    container_name: srsran_du
    privileged: true
    cap_add:
      - SYS_NICE
    networks:
      ran:
        ipv4_address: ${DU_IP}
      f1u:
        ipv4_address: ${DU_F1U_IP}
    volumes:
      - du_pcap:/tmp
    depends_on:
      cu-cp:
        condition: service_healthy
    configs:
      - du_config.yml
      - du_compose_config.yml
    command: srsdu -c /du_config.yml -c /du_compose_config.yml

configs:
  cu_cp_config.yml:
    file: ${CUCP_CONFIG_PATH:-../configs/cu_cp.yml}
  cu_cp_compose_config.yml:
    content: |
      cu_cp:
        amf:
          addr: ${AMF_RAN_IP}
          bind_addr: ${CU_CP_IP}
        e1ap:
          bind_addr: ${CU_CP_IP}
        f1ap:
          bind_addr: ${CU_CP_IP}
  cu_up_config.yml:
    file: ${CUUP_CONFIG_PATH:-../configs/cu_up.yml}
  cu_up_compose_config.yml:
    content: |
      cu_up:
        e1ap:
          cu_cp_addr: ${CU_CP_IP}
          bind_addr: ${CU_UP_IP}
        ngu:
          socket:
            -
              bind_addr: ${CU_UP_IP}
        f1u:
          socket:
            -
              bind_addr: ${CU_UP_F1U_IP}
  du_config.yml:
    file: ${DU_CONFIG_PATH:-../configs/du_zmq.yml}
  du_compose_config.yml:
    content: |
      f1ap:
        cu_cp_addr: ${CU_CP_IP}
        bind_addr: ${DU_IP}
      f1u:
        socket:
          -
            bind_addr: ${DU_F1U_IP}

volumes:
  cu_cp_pcap:
  cu_up_pcap:
  du_pcap:

networks:
  f1u:
    name: f1u_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.10.0/24
