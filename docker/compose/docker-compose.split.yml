# CU-DU split architecture: CU-CP, CU-UP, DU
# Replaces monolithic gNB. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.split.yml up
services:
  gnb-builder:
    image: srsran/gnb:latest
    build:
      context: https://github.com/srsran/srsRAN_Project.git#main
      dockerfile: docker/Dockerfile
      args:
        OS_VERSION: "24.04"
    networks: {}
    entrypoint: [ "true" ]

  cu-cp:
    container_name: srsran_cu_cp
    image: srsran/gnb:latest
    env_file:
      - .env
    networks:
      ran:
        ipv4_address: ${CU_CP_IP}
    volumes:
      - cu_cp_pcap:/tmp
    depends_on:
      gnb-builder:
        condition: service_completed_successfully
      amf:
        condition: service_started
    configs:
      - cu_cp_config.yml
      - cu_cp_compose_config.yml
    healthcheck:
      test: [ "CMD-SHELL", "for p in 38462 38472; do ss -l -H -A sctp \"sport = :$p\" | grep -q . || exit 1; done; exit 0" ]
      interval: 3s
      timeout: 1s
      retries: 60
    command: srscucp -c /cu_cp_config.yml -c /cu_cp_compose_config.yml

  cu-up:
    container_name: srsran_cu_up
    image: srsran/gnb:latest
    env_file:
      - .env
    networks:
      ran:
        ipv4_address: ${CU_UP_IP}
      f1u:
        ipv4_address: ${CU_UP_F1U_IP}
    volumes:
      - cu_up_pcap:/tmp
    depends_on:
      gnb-builder:
        condition: service_completed_successfully
      cu-cp:
        condition: service_healthy
    configs:
      - cu_up_config.yml
      - cu_up_compose_config.yml
    command: srscuup -c /cu_up_config.yml -c /cu_up_compose_config.yml

  du:
    container_name: srsran_du
    image: srsran/gnb:latest
    privileged: true
    cap_add:
      - SYS_NICE
    env_file:
      - .env
    networks:
      ran:
        ipv4_address: ${DU_IP}
      f1u:
        ipv4_address: ${DU_F1U_IP}
    volumes:
      - du_pcap:/tmp
    depends_on:
      gnb-builder:
        condition: service_completed_successfully
      cu-cp:
        condition: service_healthy
    configs:
      - du_config.yml
      - du_compose_config.yml
    command: srsdu -c /du_config.yml -c /du_compose_config.yml

configs:
  cu_cp_config.yml:
    file: ${CUCP_CONFIG_PATH:-../configs/cu_cp.yml}
  cu_cp_compose_config.yml:
    content: |
      cu_cp:
        amf:
          addr: ${AMF_RAN_IP}
          bind_addr: ${CU_CP_IP}
        e1ap:
          bind_addr: ${CU_CP_IP}
        f1ap:
          bind_addr: ${CU_CP_IP}
  cu_up_config.yml:
    file: ${CUUP_CONFIG_PATH:-../configs/cu_up.yml}
  cu_up_compose_config.yml:
    content: |
      cu_up:
        e1ap:
          cu_cp_addr: ${CU_CP_IP}
          bind_addr: ${CU_UP_IP}
        ngu:
          socket:
            -
              bind_addr: ${CU_UP_IP}
        f1u:
          socket:
            -
              bind_addr: ${CU_UP_F1U_IP}
  du_config.yml:
    file: ${DU_CONFIG_PATH:-../configs/du_zmq.yml}
  du_compose_config.yml:
    content: |
      f1ap:
        cu_cp_addr: ${CU_CP_IP}
        bind_addr: ${DU_IP}
      f1u:
        socket:
          -
            bind_addr: ${DU_F1U_IP}

volumes:
  cu_cp_pcap:
  cu_up_pcap:
  du_pcap:

networks:
  f1u:
    name: f1u_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.10.0/24
